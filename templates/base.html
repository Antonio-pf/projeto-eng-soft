{% load static %}
<!doctype html>
<html lang="pt-BR" data-theme="conecta">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Conecta Social{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    <header class="navbar container mx-auto px-6 py-4">
        <div class="flex-1">
            <a class="text-lg font-black text-neutral" href="{% url 'home' %}">Conecta Social</a>
        </div>
        <div class="flex-none">
            {% if usuario_logado %}
                <span class="mr-4 text-sm text-neutral/70">{{ usuario_logado.nome }}</span>
                <a class="btn btn-ghost btn-sm" href="{% url 'logout' %}" data-testid="navbar-logout-button">Sair</a>
            {% else %}
                <a class="btn btn-ghost btn-sm" href="{% url 'login' %}" data-testid="navbar-login-link">Entrar</a>
            {% endif %}
        </div>
    </header>
    <main class="container mx-auto flex min-h-[calc(100vh-5rem)] items-center justify-center px-6 py-12">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
