{% load static %}
{# Campo de formulário reutilizável no estilo dos cards internos (dashboard): label + widget. #}
<div class="flex flex-1 flex-col gap-1.5">
    <label class="text-sm font-semibold text-gray-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% if select %}
    <div class="relative">
        {{ field }}
        <img src="{% static 'icons/chevron-down.svg' %}" alt="" class="pointer-events-none absolute right-3 top-1/2 size-4 -translate-y-1/2">
    </div>
    {% else %}
    {{ field }}
    {% endif %}
    {% for erro in field.errors %}
    <p class="text-xs text-error">{{ erro }}</p>
    {% endfor %}
</div>
