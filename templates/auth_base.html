{% load static %}
<!doctype html>
<html lang="pt-BR" data-theme="conecta">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Conecta Social{% endblock %}</title>
    {% include "partials/_favicon.html" %}
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <script src="{% static 'js/formularios.js' %}" defer></script>
</head>
<body class="min-h-screen bg-conecta-form text-base-content">
    <div class="flex min-h-screen flex-col lg:flex-row">
        {# No celular o painel vira uma faixa curta e o formulário começa logo abaixo, sem precisar rolar. #}
        <section class="painel-marca flex flex-col gap-3 overflow-hidden px-8 py-6 text-primary-content sm:gap-6 sm:px-12 sm:py-10 lg:w-1/2 lg:max-w-[760px] lg:justify-between lg:gap-8 lg:px-16 lg:py-16">
            {% block brand %}{% endblock %}
        </section>
        <section class="flex flex-1 items-start justify-center bg-conecta-form px-8 py-8 sm:px-12 sm:py-12 lg:items-center lg:px-16">
            {% block content %}{% endblock %}
        </section>
    </div>
</body>
</html>
