{% extends "base.html" %}

{% block title %}Início | Conecta Social{% endblock %}

{% block content %}
<section class="home-panel overflow-hidden rounded-[2rem] bg-base-100 shadow-2xl">
    <div class="grid min-h-[31rem] lg:grid-cols-[1.1fr_0.9fr]">
        <div class="flex flex-col justify-between gap-12 p-8 sm:p-12 lg:p-16">
            <div>
                <p class="mb-4 text-sm font-semibold uppercase tracking-[0.2em] text-secondary">Gestão de doações</p>
                <h1 class="max-w-xl text-4xl font-black leading-tight text-neutral sm:text-6xl">Conecta Social</h1>
                <p class="mt-6 max-w-lg text-lg leading-8 text-neutral/70">Registro de doações, controle de estoque e distribuição de itens para as famílias atendidas.</p>
            </div>
            <div>
                <a class="btn btn-primary px-6 text-base" href="{% url 'login' %}">Entrar</a>
            </div>
        </div>
        <div class="brand-field relative flex items-end p-8 sm:p-12 lg:p-16">
            <div class="brand-mark" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</section>
{% endblock %}
