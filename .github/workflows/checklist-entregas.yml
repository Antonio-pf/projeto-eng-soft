name: Checklist de Entregas

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    #  08:00 America/Sao_Paulo — checagem diária de prazos
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entregas:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checar status das entregas do LAB-ES
        run: |
          set +e
          python scripts/check_entregas.py --strict > /tmp/entregas.txt
          status=$?
          cat /tmp/entregas.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
