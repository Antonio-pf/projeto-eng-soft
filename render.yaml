services:
  - type: web
    name: conecta-social
    runtime: python
    buildCommand: npm ci && npm run build && pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn conecta.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: conecta-social-wcxa.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: conecta-social-db
          property: connectionString
      # Aviso de privacidade: preencher no painel do Render com os dados reais da ONG.
      - key: ONG_NOME
        sync: false
      - key: ONG_CONTATO_PRIVACIDADE
        sync: false

databases:
  - name: conecta-social-db
    databaseName: conectasocial
    user: conectasocial
    plan: free
